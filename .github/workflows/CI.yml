name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: opened
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * SUN'

jobs:
  test:
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    runs-on: ubuntu-latest

    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{matrix.node-version}}
    - name: Instalar dependencias
      run: npm install
    - name: Ejecutar pruebas
      run: npm test
    
